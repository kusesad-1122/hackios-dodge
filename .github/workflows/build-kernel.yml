name: build-kernel

# Build the iOS 26 (xnu-12377.121.6, arm64e) kernel with the dodge SoC layer.
#
# Why macOS: Apple's XNU build wants Xcode's cctools, mig and iig, and clang's
# Apple pointer-authentication builtins. A Linux clang knows the
# __builtin_ptrauth_* names but has no implementation for them -- measured on
# Ubuntu clang 18/19/20, every target and -march combination fails with "this
# target does not support pointer authentication".
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  kernel:
    # macos-15 carries Xcode 16; macos-14 only has 15.4, whose MacOSX SDK has no
    # usr/local/libexec/availability.pl, and bsd/sys/Makefile needs it to
    # generate _symbol_aliasing.h.
    runs-on: macos-15
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - name: what this runner has
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          echo
          for t in clang ld mig iig unifdef csh plutil; do
            printf '%-10s ' "$t"
            xcrun -f "$t" 2>/dev/null || command -v "$t" || echo MISSING
          done

      - name: the kitchen sink the XNU build asks for
        run: |
          # bsd/sys/Makefile wants usr/local/libexec/availability.pl out of the
          # MacOSX SDK. Xcode 16's SDK does not ship it either; the
          # AvailabilityVersions release builds it.
          set -eux
          git clone -q --depth 1 https://github.com/apple-oss-distributions/AvailabilityVersions.git avaid
          cd avaid
          if [ -f Makefile ]; then
            make -s 2>&1 | tail -5 || true
          fi
          find . -name 'availability.pl' -o -name 'availability.py' | head -5
          cd ..

      - name: the kernel tree
        run: |
          set -eux
          git clone --depth 1 --branch xnu-12377.121.6 \
            https://github.com/apple-oss-distributions/xnu.git xnu-src
          cd xnu-src
          git apply --whitespace=nowarn ../kernel/xnu-12377.121.6-dada.patch
          git apply --whitespace=nowarn ../kernel/xnu-12377.121.6-dodge.patch
          echo "patched files:"
          git status --short | head -20

      - name: give availability.pl to every SDK that asks for one
        run: |
          set -eux
          AP=$(find "$GITHUB_WORKSPACE/avaid" -name 'availability.pl' | head -1)
          [ -n "$AP" ] || { echo "::error::AvailabilityVersions did not build availability.pl"; exit 1; }
          chmod +x "$AP"
          echo "found: $AP"
          # the build looks for it inside each SDK's usr/local/libexec
          for SDK in $(xcodebuild -showsdks -json 2>/dev/null \
                       | python3 -c 'import json,sys; print("\n".join(s.get("sdkPath", "") for s in json.load(sys.stdin)))' 2>/dev/null | sort -u) \
                     $(xcrun --sdk macosx --show-sdk-path) \
                     $(xcrun --sdk iphoneos --show-sdk-path); do
            [ -d "$SDK" ] || continue
            mkdir -p "$SDK/usr/local/libexec"
            cp -f "$AP" "$SDK/usr/local/libexec/availability.pl" 2>/dev/null \
              && echo "  installed into $SDK" \
              || echo "  could not write to $SDK (not fatal yet)"
          done

      - name: build
        working-directory: xnu-src
        env:
          XNU_SRC: ${{ github.workspace }}/xnu-src
          XNU_ARCH: arm64e
          MACHINE: BCM2837
          RC_DARWIN_KERNEL_VERSION: 12377.121.6
        run: |
          # make -k may fail after linking; the next step verifies the actual kernel.
          set +e
          bash ../kernel/xnu-build-darwin.sh -j"$(sysctl -n hw.ncpu)" 2>&1 | tee "$GITHUB_WORKSPACE/kernel-build.log"
          make_status=${PIPESTATUS[0]}
          set -e
          echo "make exit status: $make_status"

      - name: the kernel must exist
        run: |
          K=xnu-src/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
          if [ ! -s "$K" ]; then
            echo "::error::the kernel was not built"
            echo "--- what did get produced ---"
            find xnu-src/BUILD/obj -name 'mach.*' 2>/dev/null | head -10
            exit 1
          fi
          ls -l "$K"
          file "$K"
          echo
          echo "=== arm64e? the cpusubtype must carry the ptrauth bit ==="
          python3 - "$K" <<'PY'
          import struct, sys
          d = open(sys.argv[1], 'rb').read(12)
          magic, cputype, cpusub = struct.unpack('<III', d)
          assert magic == 0xfeedfacf, 'not a 64-bit Mach-O'
          assert cputype == 0x0100000c, 'not ARM64'
          assert cpusub & 0x00ffffff == 2, 'not arm64e'
          assert cpusub & 0x80000000, 'pointer-authentication ABI bit missing'
          print('  cpusubtype %#010x  ptrauth %s' % (
              cpusub & 0xffffffff,
              'SET (arm64e)' if cpusub & 0x80000000 else 'CLEAR (arm64, wrong!)'))
          PY
          echo
          echo "=== the SoC layer must be in it ==="
          nm -n "$K" > "$RUNNER_TEMP/kernel-symbols.txt"
          for s in _hakios_soc_device _hakios_soc_facts _hakios_soc_is_sm8750; do
            printf '  %-26s ' "$s"
            grep -q " $s\$" "$RUNNER_TEMP/kernel-symbols.txt" || { echo "::error::missing symbol $s"; exit 1; }
            echo present
          done
          echo "=== the phone's names ==="
          strings "$K" > "$RUNNER_TEMP/kernel-strings.txt"
          for n in dodge dada sm8750; do
            printf '  %-10s ' "$n"
            grep -qx "$n" "$RUNNER_TEMP/kernel-strings.txt" || { echo "::error::missing device name $n"; exit 1; }
            echo present
          done

      - name: save build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-diagnostics
          path: |
            kernel-build.log
            xnu-src/BUILD/obj/**/DriverKit/*.h
            xnu-src/BUILD/obj/**/DriverKit/*.iig.cpp
            xnu-src/BUILD/obj/**/TestServices/*.h
            xnu-src/BUILD/obj/**/TestServices/*.iig.cpp
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-dodge
          path: xnu-src/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
          if-no-files-found: error
