name: build-kernel

# Build the iOS 26 (xnu-12377.121.6, arm64e) kernel with the dodge SoC layer.
#
# Why macOS: Apple's XNU build wants Xcode's cctools, mig and iig, and clang's
# Apple pointer-authentication builtins. A Linux clang knows the
# __builtin_ptrauth_* names but has no implementation for them -- measured on
# Ubuntu clang 18/19/20, every target and -march combination fails with "this
# target does not support pointer authentication".
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  kernel:
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: what this runner has
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          echo
          for t in clang ld mig iig unifdef csh plutil; do
            printf '%-10s ' "$t"
            xcrun -f "$t" 2>/dev/null || command -v "$t" || echo MISSING
          done

      - name: the kernel tree
        run: |
          set -eux
          git clone --depth 1 --branch xnu-12377.121.6 \
            https://github.com/apple-oss-distributions/xnu.git xnu-src
          cd xnu-src
          # Two patches, in this order: dada's rebase (the iOS 26 arm64e backend),
          # then this repository's increment on top of it.
          git apply --whitespace=nowarn ../kernel/xnu-12377.121.6-dada.patch
          git apply --whitespace=nowarn ../kernel/xnu-12377.121.6-dodge.patch
          echo "patched files:"
          git status --short | head -20

      - name: build
        working-directory: xnu-src
        env:
          XNU_SRC: ${{ github.workspace }}/xnu-src
          XNU_ARCH: arm64e
          MACHINE: BCM2837
          RC_DARWIN_KERNEL_VERSION: 12377.121.6
        run: |
          bash ../kernel/xnu-build-darwin.sh -j"$(sysctl -n hw.ncpu)" 2>&1 | tail -100

      - name: the kernel must exist
        run: |
          K=xnu-src/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
          if [ ! -s "$K" ]; then
            echo "::error::the kernel was not built"
            find xnu-src/BUILD/obj -name 'mach.*' 2>/dev/null | head -10
            exit 1
          fi
          ls -l "$K"
          file "$K"
          echo
          echo "=== arm64e? the cpusubtype must carry the ptrauth bit ==="
          python3 - "$K" <<'PY'
          import struct, sys
          d = open(sys.argv[1], 'rb').read(12)
          magic, cputype, cpusub = struct.unpack('<Iii', d)
          print('  cpusubtype %#010x  ptrauth %s' % (
              cpusub & 0xffffffff,
              'SET (arm64e)' if cpusub & 0x80000000 else 'CLEAR (arm64, wrong!)'))
          PY
          echo
          echo "=== the SoC layer must be in it ==="
          for s in _hakios_soc_device _hakios_soc_facts _hakios_soc_is_sm8750; do
            printf '  %-26s ' "$s"
            nm -n "$K" 2>/dev/null | grep -q " $s\$" && echo present || echo ABSENT
          done
          echo "=== the phone's names ==="
          for n in dodge dada sm8750; do
            printf '  %-10s ' "$n"
            strings "$K" | grep -qx "$n" && echo present || echo absent
          done

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-dodge
          path: xnu-src/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
          if-no-files-found: error
