# OnePlus 13 (dodge), Qualcomm SM8750 "Snapdragon 8 Elite" -- iOS 26 on dada's SoC.
#
# Every address below was read out of THIS phone's own live device tree
# (backup/out/hw/hw/device-tree.dts, produced by dtc from the running fdt.bin),
# not copied from a document:
#
#   model      "Qualcomm Technologies, Inc. Sun MTP,dodge"
#   compatible "qcom,sun-mtp qcom,sun qcom,sunp-mtp qcom,sunp qcom,mtp"
#   interrupt-controller@16000000 { compatible = "arm,gic-v3";
#       reg = <0x16000000 0x10000  0x16080000 0x200000>;
#       redistributor-stride = <0x00 0x40000>; }
#   cpu@0 cpu@100 cpu@200 cpu@300 cpu@400 cpu@500 cpu@10000 cpu@10100
#   ufshc@1d84000
#   qcom,gpu-model = "Adreno830v2"
#
# The SoC is the same SM8750 ("sun" / Pakala) that dada targets, so everything at the
# SoC level -- the peripheral window, the GIC, the MPIDR layout -- is dada's.
# What is this phone's own: the panel (1440x3168), the touch controller
# (Synaptics S3910 on spi@a90000) and the GPU (Adreno830v2).
NAME="OnePlus 13 (dodge)"
KIND=phone
SOC="Qualcomm Snapdragon 8 Elite (SM8750)"

# --- boot chain ------------------------------------------------------------------------------------
# Mu-Silicium has a dodge package (Platforms/OnePlus/dodgePkg, PakalaPkg) already, so the
# UEFI port is upstream's package; the loader is ours.
UEFI_TARGET=dodge
UEFI_FD=                        # a built SILICIUM_UEFI.fd for dodge (from Mu-Silicium dodgePkg); empty until built
DTB=                           # dodge's stock device tree: backup/out/hw/hw/fdt.bin (the live one)
FD_BASE=0xA7100000             # MemoryMapLib UEFI_FD (dodgePkg/Library/MemoryMapLib)
FD_SIZE=0x300000
PAYLOAD_BASE=0xF0000000        # free on dodge between the end of DXE_Heap and Display_Reserved
HEADER_VERSION=4               # dodge's bootloader wants Android boot header v4 (dodge.toml)

# --- kernel and loader -----------------------------------------------------------------------------
# The GOP framebuffer: both dada and dodge report 0xFC800000, so the loader now also
# compares the panel's size (1440x3168 here, 1200x2670 on dada). Both values must agree
# with platform_dodge in base/xnuloader/loader.c.
FB_BASE=0xFC800000
PANEL_WIDTH=1440               # card0-DSI-1: 1440x3168x120cmd / x90cmd / x60cmd
PANEL_HEIGHT=3168
WIFI_ATH11K=0                  # SM8750 Wi-Fi is the WCN7850 (ath12k), not the WCN6750/ath11k

# --- what the run needs ----------------------------------------------------------------------------
# Bring-up like dada's first milestone: one core, no extra subsystems. Grows later
# (cpus=8, gpu=1, ...) once the kernel runs on the real core.
BOOTARGS="cpus=1"
DEFAULT_SECS=900
USERLAND_VARS=""
FIRMWARE=""
